server {
    listen 80;
    server_name localhost;

    # 前端静态文件 (代理给 frontend 容器)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API (代理给 backend 容器)
    location /api/ {
        # 重写 URL，去掉 /api 前缀 (如果 FastAPI 没有配置 root path)
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 引擎 API (可选，如果前端直接调用 AI 或通过后端中转)
    # 这里假设前端直接调用 AI 服务
    location /ai/ {
        rewrite ^/ai/(.*) /$1 break;
        proxy_pass http://ai_engine:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
