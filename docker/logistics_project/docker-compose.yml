version: '3.8'

services:
  # 容器 B: MQTT 代理
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883" # MQTT 协议端口
      - "9001:9001" # WebSocket 端口
    networks:
      - logistics_net
    restart: always

  # 容器 D: 数据库 (MongoDB)
  # 选用 Mongo 是因为对于非结构化日志数据存储比较灵活
  database:
    image: mongo:latest
    container_name: database
    volumes:
      - ./database/data:/data/db
    ports:
      - "27017:27017"
    networks:
      - logistics_net
    restart: always

  # 容器 C: 后端 API (FastAPI)
  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - mosquitto
      - database
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - DB_HOST=database
      - DB_PORT=27017
    # 不直接暴漏端口，通过 Nginx 转发
    expose:
      - "8000"
    networks:
      - logistics_net
    restart: always

  # 容器 E: AI 视觉识别引擎 (TensorFlow Serving or Custom Python)
  # 这里为了灵活性，使用 Custom Python 容器加载模型
  ai_engine:
    build: ./ai_engine
    container_name: ai_engine
    expose:
      - "5000"
    volumes:
      - ./ai_engine/model:/app/model # [NEW] 挂载模型目录，持久化训练结果
      - ./ai_engine/dataset:/app/dataset # [FIX] 挂载数据集目录，防止重启丢失
    networks:
      - logistics_net
    restart: always

  # 容器 A: 传感器模拟器
  simulator:
    build: ./simulator
    container_name: simulator
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      # 模拟获取外部真实数据的 API KEY (示例)
      - WEATHER_API_KEY=demo_key
    networks:
      - logistics_net
    restart: always

  # 容器 F: 前端 (Vue)
  frontend:
    build: ./frontend
    container_name: frontend
    # 前端容器通常构建后是 Nginx 托管静态文件，这里简化为开发模式或构建模式
    # 我们假设 Dockerfile 里是一个 Node 服务或者内置 Nginx
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - logistics_net
    restart: always

  # 容器 G: Nginx 网关 (增强复杂性)
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80" # 唯一对外暴露的 HTTP 入口
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - logistics_net
    restart: always

  # [NEW] 容器 H: Redis 缓存 (高可用缓冲层)
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - logistics_net
    restart: always

  # [NEW] 容器 I: Prometheus (时序监控)
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - logistics_net
    restart: always

  # [NEW] 容器 J: Grafana (运维可视化)
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - logistics_net
    restart: always

networks:
  logistics_net:
    driver: bridge
